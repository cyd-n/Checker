<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkers</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-white flex items-center justify-center h-screen" x-data="Checker()">
    <!-- BOARD -->
    <div class="border-4 border-black relative" x-init="NextTurn()" :key="renderKey">
        <div x-text="GetTurn()" class="text-center font-bold p-2"></div>
        <div class="border-4 border-black">
            <!-- ROWS -->
            <template x-for="row in size">
                <!-- COLUMNS -->
                <div class="flex">
                    <template x-for="col in size">
                        <div :class="GetColor(row,col)" @click="GetSeleted(row,col)">
                            <img :src="GetPlayer(row,col,false)" alt="">
                            <img :src="GetPlayer(row,col,true)" alt="">
                        </div>
                    </template>
                </div>
            </template>
        </div>
        <div class="flex gap-2 justify-center">
            <button @click="popupMode = 'save'; showPopup = true;" class="bg-black text-white px-4 py-2">Save</button>
            <button @click="" class="bg-black text-white px-4 py-2">Load</button>
            <button @click="ReStart()" class="bg-black text-white px-4 py-2">Restart</button>
        </div>
    </div>

    <!-- POPUP -->
    <div x-show="showPopup" x-transition class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-xl shadow-xl w-80 text-center">
            <!--Win or Lose-->
            <template x-if="popupMode === 'win'">
                <h2 class="text-2xl font-bold mb-4" x-text="popupTitle"></h2>

                <button @click="ReStart()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"> ReStart </button>
            </template>

            <!-- SAVE -->
            <template x-if="popupMode === 'save'">
                <div class="flex flex-col gap-2">
                    <input x-model="savePass" placeholder="Enter Password" class="border p-2 rounded">
                    <button @click="SaveGame()" class="bg-black text-white px-4 py-2 rounded">Confirm Save</button>
                    <button @click="popupMode=''; showPopup = false;" class="bg-black text-white px-4 py-2 rounded">Back</button>
                </div>
            </template>

            <template x-if="popupMode === 'showId'">
                <div class="flex flex-col gap-2">
                    <h1>ID: <span x-text="gameId"></span></h1> 
                    <button @click="popupMode=''; showPopup = false;" class="bg-black text-white px-4 py-2 rounded">Back</button>
                </div>
            </template>

            <!-- LOAD -->
            <template x-if="popupMode === 'load'">
                <div class="flex flex-col gap-2">
                    <input x-model="gameId" placeholder="Enter Id" class="border p-2 rounded">
                    <input x-model="savePass" placeholder="Enter Password" class="border p-2 rounded">
                    <button @click="LoadGame()" class="bg-black text-white px-4 py-2 rounded">Load</button>
                    <button @click="popupMode=''; showPopup = false" class="bg-black text-white px-4 py-2 rounded">Back</button>
                </div>
            </template>
        </div>
    </div>



        <!-- LOAD 
        <template x-if="popupMode === 'load'">
            <div class="flex flex-col gap-2">
                <input x-model="loadName" placeholder="Enter save name" class="border p-2 rounded">
                <button @click="LoadGame()" class="bg-yellow-500 text-white px-4 py-2 rounded">Load</button>
                <button @click="popupMode='menu'" class="bg-gray-400 text-white px-4 py-2 rounded">Back</button>
            </div>
        </template>-->

    </div>
</div>

</body>
</html>

<script src="JavaScript/index.js"></script>
