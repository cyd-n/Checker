<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkers</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

</head>
<body class="bg-white flex items-center justify-center h-screen" x-data="Checker()">
    <div class="border-4 border-black" x-init="NextTurn()" :key="renderKey">
       <div x-text="GetTurn" style="text-align: center;"></div>
        <div class="border-4 bord er-black">
            <!-- ROWS -->
            <template x-for="row in size">
                <!-- COLUMNS -->
                <div class="flex">
                    <template x-for="col in size">
                        <div :class="GetColor(row, col)"  @click="GetSeleted(row, col)">   
                            <!-- Issue -->
                            <img :src="GetPlayer(row,col,false)" alt="">
                            <img :src="GetPlayer(row,col,true)" alt="">
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>
</body>
</html>

<script src = "JavaScript/index.js"></script>
