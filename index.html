<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Square</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

</head>
<body class="bg-white flex items-center justify-center h-screen" x-data="Checker()">
    <div class="border-4 border-black">
        <!-- ROWS -->
        <template x-for="row in size">
            <!-- COLUMNS -->
            <div class="flex">
                <template x-for="col in size">
                    <div :class="GetColor(row, col)">
                        <!-- Issue -->
                       <img :src="GetPlayer(row,col,false)" alt="">
                       <img :src="GetPlayer(row,col,true)" alt="">
                    </div>
                </template>
            </div>
        </template>
    </div>

</body>
</html>

<script>
    function Checker(){
        return {
            size: 10,
            // Looks awfull
            playerWhite: [{x : 2, y : 1},{x : 4, y : 1},{x : 6, y : 1},{x : 8, y : 1},{x : 10, y : 1},
                {x : 1, y : 2},{x : 3, y : 2},{x : 5, y : 2},{x : 7, y : 2},{x : 9, y : 2},
                {x : 2, y : 3},{x : 4, y : 3},{x : 6, y : 3},{x : 8, y : 3},{x : 10, y : 3},
                {x : 1, y : 4},{x : 3, y : 4},{x : 5, y : 4},{x : 7, y : 4},{x : 9, y : 4}
            ],
            playerBlack: [{x : 1, y : 10},{x : 3, y : 10},{x : 5, y : 10},{x : 7, y : 10},{x : 9, y : 10},
                {x : 2, y : 9},{x : 4, y : 9},{x : 6, y : 9},{x : 8, y : 9},{x : 10, y : 9},
                {x : 1, y : 8},{x : 3, y : 8},{x : 5, y : 8},{x : 7, y : 8},{x : 9, y : 8},
                {x : 2, y : 7},{x : 4, y : 7},{x : 6, y : 7},{x : 8, y : 7},{x : 10, y : 7}
            ],

            GetColor(_row, _col) { return ((_row + _col) % 2 === 0) ? "w-16 h-16 bg-white border-4 border-white" : "w-16 h-16 bg-black border-4 border-black"},

            GetPlayer(_row, _col, _black = false) { 
                if(!_black){
                    for (let i = 0; i < this.playerWhite.length; i++) {
                        if(this.playerWhite[i].y == _row && this.playerWhite[i].x == _col){
                            return "White.png";
                        }
                    } 
                } else {
                    for (let i = 0; i < this.playerBlack.length; i++) {
                        if(this.playerBlack[i].y == _row && this.playerBlack[i].x == _col){
                            return "Black.png";
                        }
                    } 
                }
                return "";
            }
        }
    }
</script>
